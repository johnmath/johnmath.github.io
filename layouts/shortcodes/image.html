{{ if .Get "src" }}
<span class="glass-frame {{ with .Get "position"}}{{ . }}{{ else -}} left {{- end }}"{{ with .Get "style" }} style="{{ . | safeCSS }}"{{ end }}>
  <img src="{{ .Get "src" | safeURL }}" {{ with .Get "alt" }} alt="{{ . | plainify }}" {{ end }} {{ with .Get "width" }} width="{{ . | plainify }}" {{ end }} {{ with .Get "height" }} height="{{ . | plainify }}" {{ end }} />
</span>
{{ end }}

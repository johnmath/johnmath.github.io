<style>
  #cursor-canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 9999;
  }
  
  .terminal-interactive {
    position: relative;
    z-index: 10000;
    border-radius: 32px;
    overflow: hidden;

    background: color-mix(in srgb, var(--foreground) 1%, transparent);

    border: 2px solid color-mix(in srgb, var(--foreground) 18%, transparent);
    border-top-color: color-mix(in srgb, var(--foreground) 35%, transparent);

    box-shadow:
      inset 0 1px 0 color-mix(in srgb, white 20%, transparent),   /* top rim catches light */
      inset 1px 0 0 color-mix(in srgb, white 10%, transparent),   /* left rim, fainter */
      inset 0 -1px 0 color-mix(in srgb, black 7%, transparent),  /* bottom rim in shadow */
      0 8px 32px color-mix(in srgb, var(--foreground) 4%, transparent);
    backdrop-filter: blur(2px) saturate(1.05);
    -webkit-backdrop-filter: blur(2px) saturate(1.05);
  }

  /* Completely clean out the choppy gradient pseudo-element */
  .terminal-interactive::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    /* Smooth radial glow in the corner instead of a harsh linear angle */
  /* background: radial-gradient(
    circle at 0% 0%,
    color-mix(in srgb, var(--foreground) 7%, transparent) 0%,
    color-mix(in srgb, var(--foreground) 4%, transparent) 30%,
    transparent 60%
  ); */
    pointer-events: none;
    z-index: 1; /* Pushed above the parent background */
  }
</style>



<script>
  // Randomize glass gradient angle (120–200deg) and fade midpoint (20–60%) once per load
  const r = document.documentElement;
  r.style.setProperty('--glass-angle', `${120 + Math.random() * 80}deg`);
  r.style.setProperty('--glass-mid',   `${20  + Math.random() * 40}%`);
</script>

<canvas id="cursor-canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('cursor-canvas');
  const ctx = canvas.getContext('2d');

  const GRID_CHARS = '!@#$%^&*-=+[]{}|;:,.<>?/~`ABCDEFabcdef0123456789';
  const CELL = 18;
  const REVEAL_RADIUS = 72;
  const TICK_SECONDS = 1.5;
  const TERMINAL_RADIUS = 32;

  let targetMouse = null;
  let smoothMouse = null;
  let grid = [];

  let lastScrollX = window.scrollX;
  let lastScrollY = window.scrollY;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    buildGrid();
  }

  function buildGrid() {
    grid = [];
    const cols = Math.ceil(canvas.width / CELL) + 1;
    const rows = Math.ceil(canvas.height / CELL) + 1;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        grid.push({ x: col * CELL, y: row * CELL, col, row });
      }
    }
  }

  function getChar(col, row, t) {
    const offset = ((col * 3 + row * 7) % 20) / 20;
    const cellTick = Math.floor((t - offset * TICK_SECONDS) / TICK_SECONDS);
    const h = (col * 2971 + row * 1583 + cellTick * 7013) % GRID_CHARS.length;
    return GRID_CHARS[Math.abs(h)];
  }

  function getAccent() {
    const hex = getComputedStyle(document.body)
      .getPropertyValue('--accent').trim().replace('#', '');
    const r = parseInt(hex.slice(0,2), 16);
    const g = parseInt(hex.slice(2,4), 16);
    const b = parseInt(hex.slice(4,6), 16);
    return [r, g, b];
  }

  function pointInRoundedRect(x, y, rect, radius) {
    if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) return false;
    const inX = x < rect.left + radius;
    const inY = y < rect.top + radius;
    const outX = x > rect.right - radius;
    const outY = y > rect.bottom - radius;
    if (!(inX || outX) || !(inY || outY)) return true;
    let cx, cy;
    if (inX && inY) { cx = rect.left + radius; cy = rect.top + radius; }
    else if (outX && inY) { cx = rect.right - radius; cy = rect.top + radius; }
    else if (inX && outY) { cx = rect.left + radius; cy = rect.bottom - radius; }
    else { cx = rect.right - radius; cy = rect.bottom - radius; }
    const dx = x - cx, dy = y - cy;
    return dx*dx + dy*dy <= radius*radius;
  }

  function getTerminalRect() {
    const box = document.getElementById('terminal-box');
    return box ? box.getBoundingClientRect() : null;
  }

  function getGlassSurfaces() {
    return [
      ...document.querySelectorAll('.glass'),
      document.getElementById('terminal-box')
    ].filter(Boolean);
  }


  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let [R, G, B] = getAccent();
    const isDark = document.body.classList.contains('dark-mode');
    const t = performance.now() / 1000;

    if (targetMouse) {
      if (!smoothMouse) smoothMouse = { ...targetMouse };
      const dx = targetMouse.x - smoothMouse.x;
      const dy = targetMouse.y - smoothMouse.y;
      smoothMouse.x += dx * 0.15;
      smoothMouse.y += dy * 0.15;
    }

    if (!smoothMouse) {
      requestAnimationFrame(render);
      return;
    }

    const termRect = getTerminalRect();
    const peakAlpha = 0.9;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${CELL - 4}px 'Fira Code', monospace`;
    const surfaces = getGlassSurfaces();


    // glass center — lens distortion is fixed to the terminal, not the mouse
    // const glassX = termRect ? (termRect.left + termRect.right) / 2 : 0;
    // const glassY = termRect ? (termRect.top + termRect.bottom) / 2 : 0;
    // const glassR = termRect ? Math.max(termRect.width, termRect.height) / 2 : 1;

    
    for (const cell of grid) {
      const dx = cell.x - smoothMouse.x;
      const dy = cell.y - smoothMouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      // const cellOverTerminal = termRect && pointInRoundedRect(cell.x, cell.y, termRect, TERMINAL_RADIUS);
      let activeSurface = null;

      for (const surface of surfaces) {
        const rect = surface.getBoundingClientRect();

        const radius =
          surface.id === 'terminal-box'
            ? TERMINAL_RADIUS
            : parseFloat(getComputedStyle(surface).borderRadius) || 16;

        if (pointInRoundedRect(cell.x, cell.y, rect, radius)) {
          activeSurface = {
            el: surface,
            rect,
            radius,
            isTerminal: surface.id === 'terminal-box'
          };
          break;
        }
      }

      // outside glass: only render near cursor
      

      // if (!cellOverTerminal && dist > REVEAL_RADIUS) continue;
      if (!activeSurface && dist > REVEAL_RADIUS) continue;

      let drawX = cell.x;
      let drawY = cell.y;
      let cellAlpha;

      const t2 = dist / REVEAL_RADIUS;
      
      if (activeSurface) {
        const rect = activeSurface.rect;

        const glassX = (rect.left + rect.right) / 2;
        const glassY = (rect.top + rect.bottom) / 2;
        const glassR = Math.max(rect.width, rect.height) / 2;
        // continue
        // lens distortion from glass center — fixed, doesn't follow mouse
        const gx = cell.x - glassX;
        const gy = cell.y - glassY;
        const gd = Math.sqrt(gx*gx + gy*gy);
        const gn = gd / glassR; // 0 at center, 1 at edge
        // barrel push: peaks at mid-radius, zero at center and edge
        // const push = Math.atanh(3*gn * (1 - gn));
        const EDGE_START = 0.75;
        let push = 0;
        if (gn > EDGE_START) {
          const e = (gn - EDGE_START) / (1 - EDGE_START); // 0..1 across the rim
          push = e * e;
        }
        // slow wave per-cell gives subtle glass imperfection
        const wave = Math.sin(t * 0.3 + cell.col * 0.7 + cell.row * 0.5) * 1.8;
        drawX += (gx / (gd || 1)) * push*push + wave;
        drawY += (gy / (gd || 1)) * push*push + wave;

      if (!pointInRoundedRect(drawX,drawY,rect,activeSurface.radius)) continue;
        cellAlpha = peakAlpha * Math.exp(-t2 * t2 * 4.0) * 1.8;
        // fade where the real terminal text lives (prompt + input, near bottom)
        // const depthFromTop = (cell.y - termRect.top) / termRect.height; // 0 top → 1 bottom
        // const textDamp = 1 - Math.max(0, (depthFromTop - 0.4) / 0.6);   // full above 40%, fades to 0 at bottom
        // cellAlpha *= textDamp;
        if (activeSurface.isTerminal) {
          const depthFromTop =
            (cell.y - rect.top) / rect.height;

          const textDamp =
            1 - Math.max(0, (depthFromTop - 0.4) / 1.0);

          cellAlpha *= textDamp;
        }

        if (cellAlpha < 0.003) continue;

        const ch = getChar(cell.col, cell.row, t);

        // chromatic aberration: split RGB along the refraction vector.
        // fringe scales with displacement, so the center stays clean
        // and edges fringe hardest — just like a real lens.
        const ux = gx / (gd || 1);          // unit refraction direction
        const uy = gy / (gd || 1);
        const fringe = push * push * 0.6;    // aberration magnitude, ties to distortion
        const ca = cellAlpha / 2.2;          // per-channel: 3 stacked ≈ 1 normal draw


        // 'lighter' so overlapping channels sum back toward white in the core
        ctx.globalCompositeOperation = 'source-over';

        if (isDark) {
          // additive RGB split → real chromatic aberration on dark bg
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = `rgba(${R},0,0,${ca})`;
          ctx.fillText(ch, drawX + ux * fringe, drawY + uy * fringe);
          ctx.fillStyle = `rgba(0,${G},0,${ca})`;
          ctx.fillText(ch, drawX, drawY);
          ctx.fillStyle = `rgba(0,0,${B},${ca})`;
          ctx.fillText(ch, drawX - ux * fringe, drawY - uy * fringe);
          ctx.globalCompositeOperation = 'source-over';
        } else {
          // light bg: single clean draw, no muddy channel stacking
          ctx.fillStyle = `rgba(${R},${G},${B},${cellAlpha})`;
          ctx.fillText(ch, drawX, drawY);
        }

        continue;
      } else {
        cellAlpha = peakAlpha * Math.exp(-t2 * t2 * 5.5);
      }

      // non-glass cells: normal single draw
      if (cellAlpha < 0.003) continue;
      ctx.fillStyle = `rgba(${R},${G},${B},${cellAlpha})`;
      ctx.fillText(getChar(cell.col, cell.row, t), drawX, drawY);
    }

    requestAnimationFrame(render);
  }

  resize();
  window.addEventListener('resize', resize);
  render();

  document.addEventListener('mousemove', (e) => {
    targetMouse = { x: e.clientX, y: e.clientY };
  });

  document.addEventListener('mouseleave', () => {
    targetMouse = null;
    smoothMouse = null;
  });

  window.addEventListener('scroll', () => {
    const dx = window.scrollX - lastScrollX;
    const dy = window.scrollY - lastScrollY;

    lastScrollX = window.scrollX;
    lastScrollY = window.scrollY;

    if (targetMouse) {
      targetMouse.x -= dx;
      targetMouse.y -= dy;
    }

    if (smoothMouse) {
      smoothMouse.x -= dx;
      smoothMouse.y -= dy;
    }
  }, { passive: true });
})();
</script>
